services:
  # ฐานข้อมูล PostgreSQL หลัก (ไม่เปิดพอร์ตออกภายนอก)[cite: 1, 3]
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: weather_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Redis Cache สำหรับเก็บสถานะล่าสุด (ไม่เปิดพอร์ตออกภายนอก)[cite: 1, 3]
  redis:
    image: redis:7-alpine
    restart: always

  # Message Broker RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "15672:15672" # เข้าดู Web Management ของ RabbitMQ ได้ที่ http://localhost:15672

  # Core API Service
  core-api:
    build: ./backend
    restart: always
    ports:
      - "8080:8080" # พอร์ตสำหรับรับส่งข้อมูลกับ Web และ Pico
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - redis
      - rabbitmq

  # Alert Worker Service (ส่งแจ้งเตือนเบื้องหลัง)
  alert-worker:
    build: ./worker
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq

volumes:
  pgdata: